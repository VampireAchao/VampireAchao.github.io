还是技术党都没障碍。 猫抓的界面非常直观，装好后在浏览器扩展区点一下，弹出的popup界面会自动检测当前页面的所有资源，按类型分类显示。比如你在视频网站，能看到.mp4&#x2F;.m3u8&#x2F;.flv等音视频流，常见的m3u8流还内置了解析器，可以直接复制下载链接，甚至还能用内置工具解析分段、拼接资源，方便你做后续处理。除此之外，猫抓也兼容各种流行网站的资源结构，日常追剧、下视频、扒站素材都能用得上。最贴心的是，猫抓所有数据都本地处理，不会收集...</div></div></div></a><a class="pagination-related" href="/2023/06/08/js-as%E5%85%B3%E9%94%AE%E5%AD%97/" title="js as关键字"><div class="cover" style="background: var(--default-bg-color)"></div><div class="info text-center"><div class="info-1"><div class="info-item-1"><i class="far fa-calendar-alt fa-fw"></i> 2023-06-08</div><div class="info-item-2">js as关键字</div></div><div class="info-2"><div class="info-item-1"> 统治别人，一定要为别人谋幸福。——莫泊桑  分享一个在export以及 import使用的 as关键字 https://es6.ruanyifeng.com/#docs/module#export-%E5%91%BD%E4%BB%A4 https://es6.ruanyifeng.com/#docs/module#import-%E5%91%BD%E4%BB%A4 这里就不多多赘述简单使用，介绍一个特别的场景： 例如这里有一个js文件 123export function myFunc()export function yourFunc()  针对这个js文件export的两个方法，由于没有export default 因此不能使用 1import MyJs from &#x27;my.js&#x27;  而是只能使用 1import &#123; myFunc, yourFunc &#125; from &#x27;my.js&#x27;  但是通过as关键字，则可以 1import * as MyJs from &#x27;my.js&#x27;  然后就可以使用Myjs....</div></div></div></a></div></div></div><div class="aside-content" id="aside-content"><div class="card-widget card-info text-center"><div class="avatar-img"><img src="/img/head.png" onerror="this.onerror=null;this.src='/img/friend_404.gif'" alt="avatar"/></div><div class="author-info-name">阿超</div><div class="author-info-description">我的名字叫阿超 年龄25岁 家在北京市 职业是软件开发 每天最晚也会在八点前回家 不抽烟 酒浅尝辄止 晚上十二点上床 保证睡足八个小时 睡前写一篇博客 再做二十分钟俯卧撑暖身 然后再睡觉 基本能熟睡到天亮 像婴儿一样不留下任何疲劳和压力 就这样迎来第二天的早晨 健康检查结果也显示我很正常 我想说明我是一个不论何时都追求内心平稳的人 不拘泥于胜负 不纠结于烦恼 不树立使我夜不能寐的敌人 这就是我在这社会的生活态度</div><div class="site-data"><a href="/archives/"><div class="headline">文章</div><div class="length-num">2341</div></a><a href="/tags/"><div class="headline">标签</div><div class="length-num">36</div></a><a href="/categories/"><div class="headline">分类</div><div class="length-num">0</div></a></div><a id="card-info
